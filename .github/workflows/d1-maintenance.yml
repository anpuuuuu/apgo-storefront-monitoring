name: D1 maintenance

# Small, reviewed write operations against the production D1 database that
# otherwise need the Cloudflare dashboard. Every action validates its input
# before touching the database; nothing here runs on a schedule.
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [mute-signature, unmute-signature, list-muted]
        default: list-muted
      signature:
        description: 32-hex Layer 3 signature (mute/unmute only)
        type: string
        default: ''
      note:
        description: Why it is muted (stored in known_signatures.note)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  d1:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build statement
        id: sql
        env:
          ACTION: ${{ inputs.action }}
          SIGNATURE: ${{ inputs.signature }}
          NOTE: ${{ inputs.note }}
        run: node scripts/d1-maintenance-sql.mjs >> "$GITHUB_OUTPUT"
      - name: Execute on production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SQL: ${{ steps.sql.outputs.sql }}
        run: npx wrangler d1 execute apgo-monitoring --remote --config workers/error-monitor/wrangler.jsonc --command "$SQL"
      - name: Show the row after the change
        if: inputs.action != 'list-muted'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SQL: ${{ steps.sql.outputs.verify }}
        run: npx wrangler d1 execute apgo-monitoring --remote --config workers/error-monitor/wrangler.jsonc --command "$SQL"
