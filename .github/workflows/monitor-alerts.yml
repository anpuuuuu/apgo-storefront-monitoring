name: GA4 business monitoring

on:
  schedule:
    - cron: '19,49 * * * *'
    - cron: '17 4 * * *'
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Check to run
        type: choice
        options: [realtime, daily-primary, daily-confirm, validate]
        default: realtime
      simulate_zero:
        description: Simulate add_to_cart zero
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require monitoring configuration
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          MONITOR_WORKER_URL: ${{ vars.MONITOR_WORKER_URL }}
          MONITOR_HEARTBEAT_TOKEN: ${{ secrets.MONITOR_HEARTBEAT_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          for name in GA4_PROPERTY_ID GCP_WIF_PROVIDER MONITOR_WORKER_URL MONITOR_HEARTBEAT_TOKEN CF_API_TOKEN CF_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name is required"; exit 1; fi
          done
      - name: Authenticate with Google OIDC/WIF
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: helical-canto-505209-j7
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: codex-ga4-reader@helical-canto-505209-j7.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: false
      - name: Select GA4 check
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          mode=realtime
          if [ "$SCHEDULE" = '17 4 * * *' ]; then mode=daily-primary; fi
          if [ "$SCHEDULE" = '47 6 * * *' ]; then mode=daily-confirm; fi
          if [ "$EVENT_NAME" = workflow_dispatch ]; then mode="$INPUT_MODE"; fi
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - name: Run GA4 monitoring
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          MONITOR_WORKER_URL: ${{ vars.MONITOR_WORKER_URL }}
          MONITOR_HEARTBEAT_TOKEN: ${{ secrets.MONITOR_HEARTBEAT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SIMULATE_ZERO: ${{ inputs.simulate_zero || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case '${{ steps.select.outputs.value }}' in
            validate) VALIDATE_GA4=true node monitoring/scripts/ga4-anomaly.mjs ;;
            daily-primary) DAILY_STAGE=primary node monitoring/scripts/ga4-daily-funnel.mjs ;;
            daily-confirm) DAILY_STAGE=confirm node monitoring/scripts/ga4-daily-funnel.mjs ;;
            *) node monitoring/scripts/ga4-anomaly.mjs ;;
          esac
      - name: Notify workflow or authentication failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TITLE: APGO Layer 4 GA4 monitor failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node monitoring/scripts/telegram-notify.js
