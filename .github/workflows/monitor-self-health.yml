name: Monitoring self health

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      layer3_selftest:
        type: boolean
        default: true
      rollout_validation:
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  plan:
    if: github.event_name != 'schedule' || vars.MONITOR_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - id: matrix
        run: echo "matrix=$(node scripts/site-matrix.mjs)" >> "$GITHUB_OUTPUT"
      - name: Check central Workflow freshness once
        if: inputs.rollout_validation != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-schedule-health.mjs

  site-health:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Check Worker and Layer 1 heartbeat
        env:
          MONITOR_SITE_ID: ${{ matrix.siteId }}
          MONITOR_WORKER_URL: ${{ vars.MONITOR_WORKER_URL }}
        run: node scripts/worker-health.mjs
      - name: Refresh Layer 3 self-test
        if: github.event_name == 'schedule' || inputs.layer3_selftest == true
        env:
          MONITOR_SITE_ID: ${{ matrix.siteId }}
          MONITOR_WORKER_URL: ${{ vars.MONITOR_WORKER_URL }}
          MONITOR_HEARTBEAT_TOKEN: ${{ secrets.MONITOR_HEARTBEAT_TOKEN }}
        run: node scripts/layer3-self-test.mjs
      - name: Notify failure only in Live mode
        if: failure() && vars.MONITOR_MODE == 'live'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TITLE: ${{ matrix.label }} monitoring self-health failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/workflow-failure-notify.mjs
