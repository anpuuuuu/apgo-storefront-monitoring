name: Layer 2 storefront browser monitoring

on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      site_id:
        description: Registered site id
        required: true
        default: apgo-my
      cadence:
        description: Layer 2 journey set
        type: choice
        options: [post-deploy, daily]
        default: post-deploy
      source_repo:
        description: Exact Theme repository
        default: anpuuuuu/apgo-theme
      source_repository_id:
        description: Immutable Theme repository id
        default: "1154313539"
      source_sha:
        description: Full Theme SHA for post-deploy
        default: ""
      delivery_id:
        description: GitHub webhook delivery id
        default: manual
      retry_delay_seconds:
        type: number
        default: 60

concurrency:
  group: layer2-${{ inputs.cadence == 'post-deploy' && format('post-deploy-{0}', inputs.site_id) || format('daily-{0}', inputs.site_id || 'apgo-my') }}
  cancel-in-progress: ${{ inputs.cadence == 'post-deploy' }}

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: github.event_name != 'schedule' || vars.MONITOR_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cadence: ${{ steps.select.outputs.cadence }}
      site_id: ${{ steps.select.outputs.site_id }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      source_repo: ${{ steps.source.outputs.repository }}
      source_sha: ${{ steps.source.outputs.sha }}
      plan_error: ${{ steps.discover.outputs.error }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Select site and cadence
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SITE: ${{ inputs.site_id }}
          INPUT_CADENCE: ${{ inputs.cadence }}
        run: |
          echo "site_id=${INPUT_SITE:-apgo-my}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = schedule ]; then echo "cadence=daily" >> "$GITHUB_OUTPUT"; else echo "cadence=${INPUT_CADENCE:-post-deploy}" >> "$GITHUB_OUTPUT"; fi
      - name: Resolve and verify exact Theme source
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_SITE_ID: ${{ steps.select.outputs.site_id }}
          MONITOR_CADENCE: ${{ steps.select.outputs.cadence }}
          MONITOR_SOURCE_REPO: ${{ inputs.source_repo }}
          MONITOR_SOURCE_REPOSITORY_ID: ${{ inputs.source_repository_id }}
          MONITOR_SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/resolve-theme-source.mjs
      - name: Wait for Shopify Theme deployment
        if: steps.select.outputs.cadence == 'post-deploy'
        run: |
          for minute in 1 2 3; do echo "Waiting for storefront deployment ($minute/3)..."; sleep 60; done
      - name: Checkout exact Theme commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.sha }}
          path: workspaces/${{ steps.select.outputs.site_id }}/theme
      - name: Validate monitoring and Theme contracts
        env:
          MONITOR_SITE_ID: ${{ steps.select.outputs.site_id }}
          MONITOR_THEME_ROOT: ${{ github.workspace }}/workspaces/${{ steps.select.outputs.site_id }}/theme
        run: |
          node scripts/layer2-config.mjs validate config/sites.json
          npm run test:theme-contract
      - name: Authenticate GA4 discovery through OIDC/WIF
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: helical-canto-505209-j7
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: codex-ga4-reader@helical-canto-505209-j7.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: false
      - name: Discover paid advertising Landing Pages
        id: discover
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          MONITOR_SITE_ID: ${{ steps.select.outputs.site_id }}
        shell: bash
        run: |
          set +e
          output="$(node scripts/discover-ad-targets.mjs config/sites.json ad-targets.json 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then detail="$(echo "$output" | tr '\r\n' ' ' | cut -c1-500)"; echo "error=$detail" >> "$GITHUB_OUTPUT"; exit "$status"; fi
      - name: Build serial Batch plan
        id: matrix
        env:
          MONITOR_SITE_ID: ${{ steps.select.outputs.site_id }}
          MONITOR_THEME_ROOT: ${{ github.workspace }}/workspaces/${{ steps.select.outputs.site_id }}/theme
        shell: bash
        run: |
          matrix="$(node scripts/layer2-config.mjs matrix config/sites.json '${{ steps.select.outputs.cadence }}' ad-targets.json)"
          printf '%s\n' "$matrix" > layer2-matrix.json
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: layer2-plan-${{ github.run_id }}
          path: |
            ad-targets.json
            layer2-matrix.json
          retention-days: 14
          if-no-files-found: error

  browser-batch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-central-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install each browser engine once
        run: timeout 720 npx playwright install --with-deps chromium webkit || npx playwright install chromium webkit
      - uses: actions/download-artifact@v4
        with:
          name: layer2-plan-${{ github.run_id }}
          path: .
      - name: Run all Journeys strictly serially
        env:
          MONITOR_MATRIX_FILE: layer2-matrix.json
          MONITOR_ARTIFACTS_DIR: artifacts
          MONITOR_COMMIT: ${{ needs.plan.outputs.source_sha }}
          MONITOR_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          MONITOR_RETRY_DELAY_SECONDS: ${{ inputs.retry_delay_seconds || 60 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/run-layer2-batch.mjs
      - name: Upload evidence and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer2-batch-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

  finalize:
    if: always() && needs.plan.result != 'skipped'
    needs: [plan, browser-batch]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: layer2-batch-${{ github.run_id }}
          path: layer2-results
      - name: Aggregate and require every planned Journey
        id: aggregate
        env:
          MONITOR_PLAN_RESULT: ${{ needs.plan.result }}
          MONITOR_PLAN_ERROR: ${{ needs.plan.outputs.plan_error }}
          MONITOR_RESULTS_ROOT: layer2-results
          MONITOR_EXPECTED_MATRIX: ${{ needs.plan.outputs.matrix }}
          MONITOR_AGGREGATE_FILE: layer2-aggregate.json
          MONITOR_HEARTBEAT_DETAIL_FILE: layer2-heartbeat-detail.json
          MONITOR_CADENCE: ${{ needs.plan.outputs.cadence }}
        run: node scripts/aggregate-layer2-results.mjs
      - name: Write only Live Daily heartbeat
        if: needs.plan.outputs.cadence == 'daily' && vars.MONITOR_MODE == 'live'
        env:
          MONITOR_WORKER_URL: ${{ vars.MONITOR_WORKER_URL }}
          MONITOR_HEARTBEAT_TOKEN: ${{ secrets.MONITOR_HEARTBEAT_TOKEN }}
          MONITOR_SITE_ID: ${{ needs.plan.outputs.site_id }}
          MONITOR_LAYER: layer2
          MONITOR_STATUS: ${{ steps.aggregate.outputs.status }}
          MONITOR_SOURCE: playwright-central-daily
          MONITOR_SUITE: daily
          MONITOR_DETAIL_JSON_FILE: layer2-heartbeat-detail.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/write-heartbeat.mjs
      - name: Notify only in Live mode after both attempts fail
        if: steps.aggregate.outputs.notify == 'true' && vars.MONITOR_MODE == 'live'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TITLE: ${{ steps.aggregate.outputs.alert_title }}
          ALERT_DETAIL: ${{ steps.aggregate.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/workflow-failure-notify.mjs
      - name: Fail missing or twice-failed Journeys
        if: steps.aggregate.outputs.status == 'failed'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layer2-summary-${{ github.run_id }}
          path: |
            layer2-aggregate.json
            layer2-heartbeat-detail.json
          retention-days: 14
