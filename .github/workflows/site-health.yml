name: Site health

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'assets/**'
      - 'blocks/**'
      - 'config/**'
      - 'layout/**'
      - 'locales/**'
      - 'sections/**'
      - 'snippets/**'
      - 'templates/**'
      - 'monitoring/**'
      - '.github/workflows/site-health.yml'

concurrency:
  group: site-health-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Storefront checks
    runs-on: ubuntu-latest
    # 25 not 15: on 2026-08-19 a slow runner spent 15 min just downloading
    # Chromium and the job died at the cap; tests themselves also stretch
    # to ~10 min worst-case now that cart checks retry blips with real gaps.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: monitoring
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('monitoring/package-lock.json') }}

      - name: Install Chromium
        # Ubuntu's azure apt mirror sometimes hangs with no timeout and eats
        # the whole job (2026-08-19: two runs died this way). Give --with-deps
        # 5 minutes, then fall back to browser-only: the runner image already
        # ships Chromium's required libs; apt mostly adds CJK fonts, which
        # only failure screenshots would miss.
        run: timeout 300 npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Run health checks
        run: npx playwright test

      - name: Notify Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/telegram-notify.js

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            monitoring/test-results/
            monitoring/results.json
          retention-days: 7
          if-no-files-found: ignore
