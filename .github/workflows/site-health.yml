name: Storefront browser health

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '37 1,13 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Browser suite
        type: choice
        options: [light, full]
        default: light
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'blocks/**'
      - 'config/**'
      - 'layout/**'
      - 'locales/**'
      - 'sections/**'
      - 'snippets/**'
      - 'templates/**'
      - 'monitoring/**'
      - '.github/workflows/site-health.yml'

concurrency:
  group: storefront-health-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Select suite and isolated browser journeys
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SUITE: ${{ inputs.suite }}
        run: |
          suite=light
          matrix='[{"id":"light","market":"","flow":""}]'
          if [ "$EVENT_NAME" = push ] || [ "$SCHEDULE" = '37 1,13 * * *' ] || [ "$INPUT_SUITE" = full ]; then
            suite=full
            matrix='[{"id":"my-detergent","market":"MY","flow":"detergent"},{"id":"my-glaze","market":"MY","flow":"glaze"},{"id":"my-recommendations","market":"MY","flow":"recommendations"},{"id":"sg-detergent","market":"SG","flow":"detergent"},{"id":"sg-glaze","market":"SG","flow":"glaze"},{"id":"sg-recommendations","market":"SG","flow":"recommendations"}]'
          fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  browser:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Use a fresh runner for every full-commerce journey. max-parallel keeps
      # the checks customer-like instead of creating a synthetic request burst.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: monitoring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('monitoring/package-lock.json') }}
      - name: Install Chromium
        run: timeout 300 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Run browser journey
        id: browser-suite
        env:
          MONITOR_SUITE: ${{ needs.plan.outputs.suite }}
          MONITOR_MARKET: ${{ matrix.market }}
          MONITOR_FLOW: ${{ matrix.flow }}
        run: npm run test:${{ needs.plan.outputs.suite }}
      - name: Upload diagnostic artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ needs.plan.outputs.suite }}-${{ matrix.id }}-${{ github.run_id }}
          path: |
            monitoring/test-results/
            monitoring/playwright-report/
            monitoring/results.json
          retention-days: 7
          if-no-files-found: ignore

  finalize:
    if: always()
    needs: [plan, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require heartbeat configuration
        env:
          MONITOR_WORKER_URL: ${{ vars.MONITOR_WORKER_URL }}
          MONITOR_HEARTBEAT_TOKEN: ${{ secrets.MONITOR_HEARTBEAT_TOKEN }}
        run: |
          test -n "$MONITOR_WORKER_URL" || { echo "::error::MONITOR_WORKER_URL is required"; exit 1; }
          test -n "$MONITOR_HEARTBEAT_TOKEN" || { echo "::error::MONITOR_HEARTBEAT_TOKEN is required"; exit 1; }
      - name: Require every browser journey to pass
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$BROWSER_RESULT" = success || { echo "::error::One or more Layer 2 browser journeys failed"; exit 1; }
      - name: Write Layer 2 heartbeat
        env:
          MONITOR_WORKER_URL: ${{ vars.MONITOR_WORKER_URL }}
          MONITOR_HEARTBEAT_TOKEN: ${{ secrets.MONITOR_HEARTBEAT_TOKEN }}
          MONITOR_LAYER: layer2
          MONITOR_SOURCE: playwright-${{ needs.plan.outputs.suite }}
          MONITOR_SUITE: ${{ needs.plan.outputs.suite }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node monitoring/scripts/write-heartbeat.mjs
      - name: Notify Layer 2 failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TITLE: APGO Layer 2 browser monitoring failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node monitoring/scripts/workflow-failure-notify.mjs
