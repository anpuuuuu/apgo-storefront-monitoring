# Layer 1 DIAGNOSTIC probe. The production Layer-1 uptime check moved into
# the Cloudflare Worker cron (every 5 min, see workers/error-monitor/);
# this workflow kept its schedule for the planned 24h parallel run after that
# migration (README: Worker 部署与回退) and the schedule is now removed.
# It remains manually dispatchable for diagnostics and secret-path testing.
name: Uptime

on:
  workflow_dispatch:
    inputs:
      force_fail:
        description: '强制模拟失败(测试 Telegram 告警链路,不打真站)'
        type: boolean
        default: false
  push:
    branches: [main, 'claude/**']
    paths:
      - '.github/workflows/uptime.yml'
      - 'scripts/uptime-check.sh'
      - 'config/alerts-config.json'
      - 'config/sites.json'

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Probe sites
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          FORCE_FAIL: ${{ inputs.force_fail || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/uptime-check.sh
